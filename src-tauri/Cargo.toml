[package]
name = "rtmp-file-streamer"
version = "1.1.6"
description = "Local file to RTMP live streaming desktop app powered by FFmpeg"
authors = ["TurboKre"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
sys-locale = "0.3"
chrono = "0.4"
regex = "1"

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

# Without this feature the binary serves the devUrl (localhost:1420) instead of
# the embedded renderer; `tauri build` enables it automatically, a plain
# `cargo build --release` must be told (see build.yml and test/tauri/launch.mjs).
[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1

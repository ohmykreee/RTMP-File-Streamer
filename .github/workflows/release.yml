# Publishing a release: build the portable archives and attach them to that
# release.
#
# Triggered by `release: created` — publishing a release is the act that says
# "these artifacts are the release". `build.yml` covers the push-to-main case and
# stops at the artifact; this one is the only place that writes to a release.
#
# Same build layout as `build.yml` (Tauri: one self-contained job per target —
# see the matrix and the runner-placement notes there), and the two packaging
# jobs must stay in sync. The gate is the same file `build.yml` uses
# (`checks.yml`: both typechecks + the TS and Rust backend suites). Only the
# last job differs — this workflow attaches the archives to the release,
# `build.yml` stops at the artifacts.
name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  # Required for softprops/action-gh-release to upload assets to the release the
  # event carries.
  contents: write

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml

  portable:
    name: portable (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-amd64
            os: ubuntu-latest
            target: x86_64-pc-windows-msvc
            windows-cross: true
          - name: win-arm64
            # Must run on an arm64 host: llvm-rc stamps the host architecture
            # into the resource COFF object and lld-link rejects a mismatch
            # (see the runner-placement notes in build.yml).
            os: ubuntu-24.04-arm
            target: aarch64-pc-windows-msvc
            windows-cross: true
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            linux-native: true
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linux-cross: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # cargo-xwin downloads the MSVC CRT + Windows SDK into this directory; the
      # cache step below keeps the ~1 GB from being fetched on every run.
      XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin-cache
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26.7.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      # No `--ignore-scripts`: the allowlist in `pnpm-workspace.yaml` decides
      # which build scripts run, and esbuild's is required (see checks.yml).
      - name: Prepare workspace
        run: pnpm ci

      # The About panel's version/commit/nightly come from this file, which is
      # generated rather than committed (`pnpm build:tauri` does the same).
      - name: Write the build identity
        run: node scripts/build-info.mjs

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          # Exact version, matching local development (vfox-installed toolchain).
          toolchain: 1.99.1
          # This action's cross-target input is `target` (dtolnay's was `targets`).
          target: ${{ matrix.target }}
          # The explicit cargo-registry cache steps below stay the only cache
          # layer; the action's built-in rust-cache would double them up.
          cache: false

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Linux amd64 dependencies
        if: matrix.linux-native == true
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      - name: Install Linux arm64 cross dependencies
        if: matrix.linux-cross == true
        run: |
          set -euxo pipefail
          sudo dpkg --add-architecture arm64
          sudo sed -i 's|^deb |deb [arch=amd64,i386] |' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config \
            libwebkit2gtk-4.1-dev:arm64 libgtk-3-dev:arm64 librsvg2-dev:arm64 \
            libssl-dev:arm64
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # Windows cross build: cargo-xwin supplies the MSVC CRT/SDK and points
      # rustc at clang-cl + lld-link; tauri-build compiles the icon/manifest
      # resource with llvm-rc. All three tools come from the Ubuntu archive.
      - name: Install Windows cross dependencies
        if: matrix.windows-cross == true
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm
          # The metapackages normally install unversioned tools on PATH; link the
          # versioned binaries if this image does not.
          for tool in clang-cl llvm-rc; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              src="$(find /usr/lib/llvm-* -maxdepth 2 \( -type f -o -type l \) -name "$tool" | sort -V | tail -1)"
              test -n "$src"
              sudo ln -sf "$src" "/usr/local/bin/$tool"
            fi
          done
          mkdir -p "$XWIN_CACHE_DIR"
          clang-cl --version
          lld-link --version
          # llvm-rc has no --version option; /? prints the banner and exits 0.
          llvm-rc /? | head -1

      - name: Install cargo-xwin
        if: matrix.windows-cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      # The CRT/SDK download is ~1 GB; caching it avoids fetching it again on
      # every run of this leg (the two Windows legs keep separate caches).
      - name: Cache the Windows CRT/SDK
        if: matrix.windows-cross == true
        uses: actions/cache@v4
        with:
          path: .xwin-cache
          key: xwin-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Generate embedded i18n/defaults JSON
        run: node scripts/generate-i18n.mjs

      - name: Tauri renderer build
        run: pnpm run build:renderer

      - name: Build release binary (${{ matrix.target }})
        working-directory: src-tauri
        run: |
          set -euxo pipefail
          if [ "${{ matrix.windows-cross }}" = "true" ]; then
            # cargo xwin == cargo + xwin's CRT/SDK paths and the LLVM linker.
            cargo xwin build --release --target ${{ matrix.target }} --features custom-protocol
          else
            cargo build --release --target ${{ matrix.target }} --features custom-protocol
          fi

      - name: Assemble portable directory
        run: node scripts/assemble-tauri-dist.mjs --target ${{ matrix.target }}

      # Run from inside `release/` so the zip's single top-level entry is the
      # portable folder itself, and smoke-check the listing for the executable
      # and the Data/ placeholder so an empty or wrong-target archive fails here.
      - name: Archive (${{ matrix.name }})
        run: |
          set -euxo pipefail
          name="rtmp-file-streamer-${{ matrix.name }}"
          mkdir -p dist
          (cd release && zip -r -q "../dist/${name}.zip" "${name}")
          unzip -l "dist/${name}.zip" | head -3
          case "${{ matrix.name }}" in
            win-*)
              # A cross build must produce a Windows PE, not a Linux binary that
              # merely carries the .exe name.
              file "release/${name}/RTMPFileStreamer.exe" | grep -qi 'MS Windows' || exit 1
              unzip -l "dist/${name}.zip" | grep -E "${name}/(Data/|RTMPFileStreamer\.exe)" || exit 1
              ;;
            linux-*)
              unzip -l "dist/${name}.zip" | grep -E "${name}/(Data/|rtmp-file-streamer)" || exit 1
              ;;
          esac
          ls -lh "dist/${name}.zip"

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: rtmp-file-streamer-${{ matrix.name }}
          path: dist/rtmp-file-streamer-${{ matrix.name }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Same matrix as `build.yml`'s macOS job (`mac-intel` and a bare `mac` for the
  # Apple-silicon build; `macos-latest` is arm64 hardware, so that leg is native
  # and the Intel leg is cross-compiled on it).
  portable-macos:
    name: portable (macOS${{ matrix.suffix }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: '-intel'
            target: x86_64-apple-darwin
          - suffix: ''
            target: aarch64-apple-darwin
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26.7.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - name: Prepare workspace
        run: pnpm ci

      # The About panel's version/commit/nightly come from this file, which is
      # generated rather than committed (`pnpm build:tauri` does the same).
      - name: Write the build identity
        run: node scripts/build-info.mjs

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          # Exact version, matching local development (vfox-installed toolchain).
          toolchain: 1.99.1
          # This action's cross-target input is `target` (dtolnay's was `targets`).
          target: ${{ matrix.target }}
          # The explicit cargo-registry cache steps below stay the only cache
          # layer; the action's built-in rust-cache would double them up.
          cache: false

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Generate embedded i18n/defaults JSON
        run: node scripts/generate-i18n.mjs

      - name: Tauri renderer build
        run: pnpm run build:renderer

      - name: Build release binary (${{ matrix.target }})
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }} --features custom-protocol

      - name: Assemble portable directory
        run: node scripts/assemble-tauri-dist.mjs --target ${{ matrix.target }}

      - name: Ad-hoc sign the binary
        run: |
          suffix="${{ matrix.suffix }}"
          if [ "$suffix" = "-intel" ]; then dir="rtmp-file-streamer-mac-intel"; else dir="rtmp-file-streamer-mac"; fi
          codesign --force --sign - "release/$dir/RTMPFileStreamer"
          codesign --verify --strict "release/$dir/RTMPFileStreamer"

      - name: Archive macOS${{ matrix.suffix }}
        run: |
          set -euxo pipefail
          suffix="${{ matrix.suffix }}"
          if [ "$suffix" = "-intel" ]; then dir="rtmp-file-streamer-mac-intel"; else dir="rtmp-file-streamer-mac"; fi
          mkdir -p dist
          (cd release && ditto -c -k --sequesterRsrc --keepParent "$dir" "../dist/rtmp-file-streamer-mac${suffix}.zip")
          unzip -l "dist/rtmp-file-streamer-mac${suffix}.zip" | head -3
          ls -lh dist/

      - name: Upload the macOS build
        uses: actions/upload-artifact@v7
        with:
          name: rtmp-file-streamer-mac${{ matrix.suffix }}
          path: dist/rtmp-file-streamer-mac${{ matrix.suffix }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The one job that makes this workflow different from `build.yml`. It runs on
  # both triggers so a manual run still proves all six archives were produced
  # and collected; only the upload itself is reserved for a real release event,
  # because a dispatch carries no release to attach to.
  attach:
    name: attach to release
    needs: [portable, portable-macos]
    runs-on: ubuntu-latest
    steps:
      # One download step for all six archives, so they are attached in a single
      # release update instead of six racing ones.
      - name: Download the portable artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rtmp-file-streamer-*
          path: dist
          merge-multiple: true

      - name: List what will be attached
        run: ls -lh dist

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          # A missing archive means a platform silently produced nothing: fail rather
          # than publish a release that is missing one of the six.
          fail_on_unmatched_files: true

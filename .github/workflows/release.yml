# Publishing a release: build the portable archives and attach them to that
# release.
#
# Triggered by `release: created` — publishing a release is the act that says
# "these artifacts are the release". `build.yml` covers the push-to-main case and
# stops at the artifact; this one is the only place that writes to a release.
#
# Same build layout as `build.yml` (Tauri: one self-contained job per target —
# see the matrix and the runner-placement notes there), and the two packaging
# jobs must stay in sync. The gate is the same file `build.yml` uses
# (`checks.yml`: both typechecks + the TS and Rust backend suites). Only the
# last job differs — this workflow attaches the archives to the release,
# `build.yml` stops at the artifacts.
name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  # Required for softprops/action-gh-release to upload assets to the release the
  # event carries.
  contents: write

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml

  portable:
    name: portable (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: win-arm64
            # Native ARM64 Windows: MSVC/SDK are preinstalled, so this is not a
            # cross build and downloads no separate toolchain.
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            linux-native: true
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            linux-native: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26.7.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      # No `--ignore-scripts`: the allowlist in `pnpm-workspace.yaml` decides
      # which build scripts run, and esbuild's is required (see checks.yml).
      - name: Prepare workspace
        run: pnpm ci

      # The About panel's version/commit/nightly come from this file, which is
      # generated rather than committed (`pnpm build:tauri` does the same).
      - name: Write the build identity
        run: node scripts/build-info.mjs

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          # Exact version, matching local development (vfox-installed toolchain).
          toolchain: 1.99.1
          # This action's cross-target input is `target` (dtolnay's was `targets`).
          target: ${{ matrix.target }}
          # The explicit cargo-registry cache steps below stay the only cache
          # layer; the action's built-in rust-cache would double them up.
          cache: false

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      # Linux: the webkit2gtk stack Tauri renders with. Each Linux leg runs on
      # its own architecture, so the native packages already match the target;
      # only LINKING needs the dev headers.
      - name: Install Linux dependencies
        if: matrix.linux-native == true
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      - name: Generate embedded i18n/defaults JSON
        run: node scripts/generate-i18n.mjs

      - name: Tauri renderer build
        run: pnpm run build:renderer

      - name: Build release binary (${{ matrix.target }})
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }} --features custom-protocol

      - name: Assemble portable directory
        run: node scripts/assemble-tauri-dist.mjs --target ${{ matrix.target }}

      # Linux: run from inside `release/` so the zip's single top-level entry is
      # the portable folder itself, and smoke-check the executable and the Data/
      # placeholder so an empty or wrong-target archive fails here.
      - name: Archive (${{ matrix.name }})
        if: runner.os != 'Windows'
        run: |
          set -euxo pipefail
          name="rtmp-file-streamer-${{ matrix.name }}"
          mkdir -p dist
          (cd release && zip -r -q "../dist/${name}.zip" "${name}")
          unzip -l "dist/${name}.zip" | head -3
          unzip -l "dist/${name}.zip" | grep -E "${name}/(Data/|rtmp-file-streamer)" || exit 1
          ls -lh "dist/${name}.zip"

      # Windows: `tar.exe` is bsdtar and writes a zip with forward-slash entries;
      # Compress-Archive stores backslashes, which non-Windows unzip would treat
      # as literal filename characters. `-C release` keeps the portable folder as
      # the single top-level entry.
      - name: Archive Windows (${{ matrix.name }})
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "rtmp-file-streamer-${{ matrix.name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          tar -a -c -f "dist/${name}.zip" -C release $name
          $entries = tar -tf "dist/${name}.zip"
          $entries | Select-Object -First 3
          if (-not ($entries -contains "$name/RTMPFileStreamer.exe")) { throw "missing $name/RTMPFileStreamer.exe" }
          if (-not ($entries -contains "$name/Data/")) { throw "missing $name/Data/" }
          Get-Item "dist/${name}.zip" | Select-Object Name, Length

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: rtmp-file-streamer-${{ matrix.name }}
          path: dist/rtmp-file-streamer-${{ matrix.name }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Same matrix as `build.yml`'s macOS job (`mac-intel` and a bare `mac` for the
  # Apple-silicon build; `macos-latest` is arm64 hardware, so that leg is native
  # and the Intel leg is cross-compiled on it).
  portable-macos:
    name: portable (macOS${{ matrix.suffix }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: '-intel'
            target: x86_64-apple-darwin
          - suffix: ''
            target: aarch64-apple-darwin
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26.7.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - name: Prepare workspace
        run: pnpm ci

      # The About panel's version/commit/nightly come from this file, which is
      # generated rather than committed (`pnpm build:tauri` does the same).
      - name: Write the build identity
        run: node scripts/build-info.mjs

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          # Exact version, matching local development (vfox-installed toolchain).
          toolchain: 1.99.1
          # This action's cross-target input is `target` (dtolnay's was `targets`).
          target: ${{ matrix.target }}
          # The explicit cargo-registry cache steps below stay the only cache
          # layer; the action's built-in rust-cache would double them up.
          cache: false

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Generate embedded i18n/defaults JSON
        run: node scripts/generate-i18n.mjs

      - name: Tauri renderer build
        run: pnpm run build:renderer

      - name: Build release binary (${{ matrix.target }})
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }} --features custom-protocol

      - name: Assemble portable directory
        run: node scripts/assemble-tauri-dist.mjs --target ${{ matrix.target }}

      - name: Ad-hoc sign the binary
        run: |
          suffix="${{ matrix.suffix }}"
          if [ "$suffix" = "-intel" ]; then dir="rtmp-file-streamer-mac-intel"; else dir="rtmp-file-streamer-mac"; fi
          codesign --force --sign - "release/$dir/RTMPFileStreamer"
          codesign --verify --strict "release/$dir/RTMPFileStreamer"

      - name: Archive macOS${{ matrix.suffix }}
        run: |
          set -euxo pipefail
          suffix="${{ matrix.suffix }}"
          if [ "$suffix" = "-intel" ]; then dir="rtmp-file-streamer-mac-intel"; else dir="rtmp-file-streamer-mac"; fi
          mkdir -p dist
          (cd release && ditto -c -k --sequesterRsrc --keepParent "$dir" "../dist/rtmp-file-streamer-mac${suffix}.zip")
          unzip -l "dist/rtmp-file-streamer-mac${suffix}.zip" | head -3
          ls -lh dist/

      - name: Upload the macOS build
        uses: actions/upload-artifact@v7
        with:
          name: rtmp-file-streamer-mac${{ matrix.suffix }}
          path: dist/rtmp-file-streamer-mac${{ matrix.suffix }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The one job that makes this workflow different from `build.yml`. It runs on
  # both triggers so a manual run still proves all six archives were produced
  # and collected; only the upload itself is reserved for a real release event,
  # because a dispatch carries no release to attach to.
  attach:
    name: attach to release
    needs: [portable, portable-macos]
    runs-on: ubuntu-latest
    steps:
      # One download step for all six archives, so they are attached in a single
      # release update instead of six racing ones.
      - name: Download the portable artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rtmp-file-streamer-*
          path: dist
          merge-multiple: true

      - name: List what will be attached
        run: ls -lh dist

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          # A missing archive means a platform silently produced nothing: fail rather
          # than publish a release that is missing one of the six.
          fail_on_unmatched_files: true

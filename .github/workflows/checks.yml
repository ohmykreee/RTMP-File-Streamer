# The gate every other workflow starts with, in one place.
#
# `build.yml` (push to `main`, manual) and `release.yml` (release created) used to
# carry a byte-identical `checks` job each, so the two always drifted apart. They
# now both `uses:` this file, and the only thing either of them owns is what
# happens AFTER the gate: build.yml stops at the artifact, release.yml attaches it
# to the release. Nothing here builds or uploads — it is pass/fail only.
#
# Two gates, in this order:
#   1. typecheck  — `pnpm typecheck` (node + web projects)
#   2. backend tests — `pnpm run test:unit`: ffmpeg command vectors executed for
#      real, subtitle burn-in, encoder-lead bounding, a local RTMP push, and the
#      obs-websocket endpoint over a real socket. This is the whole
#      non-Electron suite; the Electron suites stay out of CI on purpose.
#
# Ubuntu only, on purpose:
#   * the tests need a real ffmpeg/ffprobe on PATH, and the static Linux build
#     installed below is how CI gets one without packaging ffmpeg into the app
#   * the checks say nothing about a platform — the app code under test is
#     platform-independent JS/TS, and the three packaged builds are compiled on
#     their own runners afterwards. Running this gate again on macOS or Windows
#     would only make every build twice as slow
#   * `runs-on: ubuntu-latest` is a job-level key, so this reusable workflow
#     cannot be pointed at another runner by a caller
name: Checks

on:
  workflow_call:

jobs:
  checks:
    name: typecheck + backend tests
    runs-on: ubuntu-latest
    # Well above the 10-minute watchdog inside the harness: the watchdog is what
    # reports a stuck ffmpeg, this is only the backstop for a stuck runner.
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@master

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Exact version, matching local development: a floating `26` would let the
          # compiler (and its lib types) drift between CI and a local run.
          node-version: 26.7.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      # `--ignore-scripts`: nothing here needs a postinstall. In particular this
      # skips Electron's ~100 MB binary download, which the gate never launches.
      - name: Prepare workspace
        run: pnpm ci --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

      # --- FFmpeg --------------------------------------------------------------
      # The app deliberately does not bundle ffmpeg/ffprobe (GPL, and large), and the
      # Ubuntu runner image does not preinstall it, so the gate installs it — from the
      # distribution's own archive, which is the distro-sanctioned way to get it and
      # comes with Canonical's security updates.
      #
      # `libavcodec-extra` is NOT optional here. Ubuntu splits the GPL/patent-encumbered
      # encoders out of the base library: plain `ffmpeg` depends on the plain
      # `libavcodec<NN>`, while the `-extra` build is the one that links libx264,
      # libx265, libmp3lame and libopus. The suite really encodes with libx264 (fixture
      # generation, the burn-in transcode, the "copy falls back to software" case) and
      # asserts on libx265, so without it a batch of checks fail with "Unknown encoder".
      # The extra package installs the same shared object the base one would, so
      # `ffmpeg` itself needs no swap — it just gains the encoders.
      #
      # What the checks then run against is Canonical's build for whichever Ubuntu the
      # runner is on. `ubuntu-latest` is 24.04 today (FFmpeg 6.1.1) and is announced to
      # become 26.04 during 2026 (FFmpeg 8.0.1); both ship the encoders and filters
      # this suite uses, and the install line below needs no change between them
      # because `libavcodec-extra` is a version-less metapackage (24.04 resolves it to
      # libavcodec-extra60, 26.04 to libavcodec-extra62) that pulls the same GPL
      # encoder set in either release.
      #
      # The deliberate trade: a distro-maintained, signed build that is what a user
      # running this app on Ubuntu actually has, over a newer tarball from a
      # third-party site — and no 40 MB download for the gate to get wrong. Neither
      # release is the upstream tip; the point is that the suite runs against a real
      # distribution build, not against whatever is newest today.
      - name: Install FFmpeg (Ubuntu archive)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libavcodec-extra

      # Verified rather than assumed, because everything below is real transcoding:
      # a build without the encoders, or without a font for libass to draw with, would
      # otherwise fail deep inside a black-box encode where the cause is invisible.
      # The subtitle sample is generated here rather than read from `.test/` — those
      # fixtures do not exist yet, they are made by `test:unit` further down.
      - name: Report the toolchain the tests will use
        run: |
          set -euxo pipefail
          ffmpeg -hide_banner -version | head -1
          # `which`, not a hardcoded path: this is what proves the install landed on PATH.
          which ffmpeg ffprobe
          ffmpeg -hide_banner -filters | grep -E ' (subtitles|signalstats|metadata) ' \
            || { echo "::error::this ffmpeg is missing subtitles/signalstats/metadata"; exit 1; }
          # The suite asserts on rendered subtitle pixels, so "libass can draw text"
          # gets its own line instead of surfacing as a mystery YMAX=0 later.
          printf '1\n00:00:00,000 --> 00:00:01,000\nfont probe\n' > "$RUNNER_TEMP/probe.srt"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=black:s=320x240:d=1 \
            -vf "subtitles=$RUNNER_TEMP/probe.srt" -frames:v 1 -f null - \
            || { echo "::error::the subtitles filter cannot render text — the burn-in checks will fail"; exit 1; }

      - name: Backend tests
        run: pnpm run test:unit

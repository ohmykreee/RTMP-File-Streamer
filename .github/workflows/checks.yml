# Backend verification.
#
# Typecheck only. The test suites are NOT run here: they need ffmpeg/ffprobe (the
# harness drives them for real — transcodes, subtitle burn-in, a local RTMP
# ingest), and this project deliberately does not bundle ffmpeg, so provisioning
# it on a runner is extra machinery for a check that is already covered locally by
# `pnpm test:ci`. Types are the part CI can answer cheaply and unambiguously.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push to a PR branch makes the in-flight run obsolete.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@master

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Exact version, matching local development: a floating `26` would let the
          # compiler (and its lib types) drift between CI and a local run.
          node-version: 26.7.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Pinned to the version used for local development, so CI and a local run
          # resolve and lay out `node_modules` identically.
          version: 12.8.1

      # `--ignore-scripts` skips lifecycle scripts (Electron's and esbuild's
      # postinstall downloads in particular). Typechecking needs neither, and this
      # also doubles as the check that nothing in the project depends on a
      # postinstall script running: if one were required, it would fail here.
      - name: Prepare workspace
        run: pnpm ci --ignore-scripts

      # Printed so a CI log shows exactly which toolchain produced the result; a
      # drift from the local versions is visible rather than inferred.
      - name: Report the toolchain
        run: |
          node --version
          pnpm --version

      - name: Typecheck
        run: pnpm run typecheck

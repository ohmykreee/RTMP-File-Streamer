# The gate every other workflow starts with, in one place.
#
# `build.yml` (push to `main`, manual) and `release.yml` (release created) used to
# carry a byte-identical `checks` job each, so the two always drifted apart. They
# now both `uses:` this file, and the only thing either of them owns is what
# happens AFTER the gate: build.yml stops at the artifact, release.yml attaches it
# to the release. Nothing here builds or uploads — it is pass/fail only.
#
# The branch carries TWO backends, and the gate checks both:
#   1. the Electron trees (kept for merges from main): `pnpm typecheck` for the
#      node + web projects and `pnpm run test:unit` — the TypeScript suite that
#      remains the behavioural contract the Rust port is held against,
#   2. the Rust backend (`src-tauri/`): `pnpm run typecheck:tauri` for the Tauri
#      renderer and `cargo test --release` — the ported suite runs the ffmpeg
#      command vectors, real transcodes with subtitle burn-in verification, the
#      missing-track generation, a local RTMP ingest, the obs-websocket endpoint
#      and the engine scenarios, plus the pure unit tests.
#
# Ubuntu only, on purpose:
#   * the tests need a real ffmpeg/ffprobe on PATH, and the static Linux build
#     installed below is how CI gets one without packaging ffmpeg into the app
#   * the Rust tests spawn real ffmpeg/ingest processes; one gate runner is the
#     cheap place to run them
name: Checks

on:
  workflow_call:

jobs:
  checks:
    name: typecheck + backend tests (ts + rust)
    runs-on: ubuntu-latest
    # Well above the watchdogs inside the harnesses (10 min TS; per-test timeouts
    # in Rust): the watchdogs report a stuck ffmpeg, this is only the backstop
    # for a stuck runner.
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Exact version, matching local development: a floating `26` would let the
          # compiler (and its lib types) drift between CI and a local run.
          node-version: 26.7.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      # Build scripts RUN here, and `pnpm-workspace.yaml` decides which: its
      # `allowBuilds` allowlist covers electron, esbuild and electron-winstaller, and
      # everything else stays blocked. That allowlist is the reason this is a plain
      # install — `--ignore-scripts` was tried and it broke the gate, because esbuild's
      # postinstall is what puts the native binary in place, and `test:unit` bundles
      # its modules with esbuild.
      - name: Prepare workspace
        run: pnpm ci

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          # Exact version, matching local development (vfox-installed toolchain).
          toolchain: 1.99.1
          # The explicit cargo-registry cache steps below stay the only cache
          # layer; the action's built-in rust-cache would double them up.
          cache: false

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Typecheck
        run: |
          pnpm run typecheck
          pnpm run typecheck:tauri

      # --- FFmpeg --------------------------------------------------------------
      # The app deliberately does not bundle ffmpeg/ffprobe (GPL, and large), and the
      # Ubuntu runner image does not preinstall it, so the gate installs it — from the
      # distribution's own archive, which is the distro-sanctioned way to get it and
      # comes with Canonical's security updates.
      #
      # `libavcodec-extra` is NOT optional here. Ubuntu splits the GPL/patent-encumbered
      # encoders out of the base library: plain `ffmpeg` depends on the plain
      # `libavcodec<NN>`, while the `-extra` build is the one that links libx264,
      # libx265, libmp3lame and libopus. Both suites really encode with libx264 (fixture
      # generation, the burn-in transcode, the "copy falls back to software" case) and
      # assert on libx265, so without it a batch of checks fail with "Unknown encoder".
      # The extra package installs the same shared object the base one would, so
      # `ffmpeg` itself needs no swap — it just gains the encoders.
      #
      # What the checks then run against is Canonical's build for whichever Ubuntu the
      # runner is on. `ubuntu-latest` is 24.04 today (FFmpeg 6.1.1) and is announced to
      # become 26.04 during 2026 (FFmpeg 8.0.1); both ship the encoders and filters
      # this suite uses, and the install line below needs no change between them
      # because `libavcodec-extra` is a version-less metapackage (24.04 resolves it to
      # libavcodec-extra60, 26.04 to libavcodec-extra62) that pulls the same GPL
      # encoder set in either release.
      #
      # The deliberate trade: a distro-maintained, signed build that is what a user
      # running this app on Ubuntu actually has, over a newer tarball from a
      # third-party site — and no 40 MB download for the gate to get wrong. Neither
      # release is the upstream tip; the point is that the suite runs against a real
      # distribution build, not against whatever is newest today.
      - name: Install FFmpeg (Ubuntu archive)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libavcodec-extra

      # `cargo test` compiles the Tauri Linux backend, so the GTK/WebKit stack
      # has to be linkable even though the tests never open a window: without the
      # dev headers gobject-sys / glib-sys / gio-sys die in their build scripts
      # with the generic "system library not found" error. Same package set the
      # linux-amd64 packaging leg installs.
      - name: Install Tauri Linux dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      # Verified rather than assumed, because everything below is real transcoding:
      # a build without the encoders, or without a font for libass to draw with, would
      # otherwise fail deep inside a black-box encode where the cause is invisible.
      # The subtitle sample is generated here rather than read from `test/` — those
      # fixtures do not exist yet, they are made by `test:unit` further down.
      - name: Report the toolchain the tests will use
        run: |
          set -euxo pipefail
          ffmpeg -hide_banner -version | head -1
          # `which`, not a hardcoded path: this is what proves the install landed on PATH.
          which ffmpeg ffprobe
          ffmpeg -hide_banner -filters | grep -E ' (subtitles|signalstats|metadata) '             || { echo "::error::this ffmpeg is missing subtitles/signalstats/metadata"; exit 1; }
          # The suite asserts on rendered subtitle pixels, so "libass can draw text"
          # gets its own line instead of surfacing as a mystery YMAX=0 later.
          printf '1
          00:00:00,000 --> 00:00:01,000
          font probe
          ' > "$RUNNER_TEMP/probe.srt"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=black:s=320x240:d=1             -vf "subtitles=$RUNNER_TEMP/probe.srt" -frames:v 1 -f null -             || { echo "::error::the subtitles filter cannot render text — the burn-in checks will fail"; exit 1; }

      # The message tables and default settings the Rust side embeds are dumped from
      # the TypeScript source of truth before every build; they are gitignored
      # generated files.
      - name: Generate embedded i18n/defaults JSON
        run: node scripts/generate-i18n.mjs

      - name: Tauri renderer build
        run: pnpm run build:renderer

      # Single-threaded on purpose: the engine scenarios bind RTMP ports and spawn
      # many ffmpeg processes; parallel test binaries would fight over both.
      - name: Rust backend tests
        working-directory: src-tauri
        run: cargo test --release -- --test-threads=1

      - name: TypeScript backend tests
        run: pnpm run test:unit
